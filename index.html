<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#080b09" />
<title>Soberano | Assistência Técnica</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Soberano" />
<style>
:root{
  --bg:#080b09; --bg2:#0a0d0b; --card:#0f1512; --card2:#171d19; --card3:#222b24;
  --border:rgba(53,216,117,.16); --border2:rgba(53,216,117,.30);
  --green:#35d875; --green2:#57e890; --green-d:#07964c;
  --orange:#ff9f1c; --orange2:#ffc067; --red:#ff5b5b; --blue:#58b2ff;
  --text:#f2f6f2; --muted:#a7b3a9; --muted2:#84aa8c;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 80% -10%, rgba(7,150,76,.18), transparent 60%), var(--bg);
  color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh; min-height:100dvh;
  overscroll-behavior-y:contain;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:var(--green)}
.hidden{display:none !important}

/* ====== LOGIN / SETUP ====== */
.auth-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:100%;max-width:400px;background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--border);border-radius:22px;padding:28px 24px;box-shadow:var(--shadow)}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px}
.auth-logo img{width:92px;height:92px;border-radius:20px;background:#0c120e;padding:6px;border:1px solid var(--border)}
.auth-logo b{font-size:22px;letter-spacing:.5px}
.auth-logo span{font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}

/* ====== APP SHELL ====== */
.topbar{position:sticky;top:0;z-index:40;background:rgba(8,11,9,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.topbar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:40px;height:40px;border-radius:11px;background:#0c120e;border:1px solid var(--border)}
.brand .bt{line-height:1.05;min-width:0}
.brand .bt b{font-size:15px;display:block;letter-spacing:.3px}
.brand .bt span{font-size:9px;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase}
.topbar .spacer{flex:1}
.icon-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);
  border-radius:11px;padding:9px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.icon-btn.ghost{background:transparent}
.icon-btn:active{transform:scale(.97)}

.nav{position:sticky;top:60px;z-index:30;background:rgba(8,11,9,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border)}
.nav-in{max-width:1100px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:8px 10px;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:11px;
  color:var(--muted);font-size:13.5px;font-weight:600;text-decoration:none;border:1px solid transparent;white-space:nowrap}
.nav a .dot{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center}
.nav a.active{color:var(--green);background:rgba(53,216,117,.10);border-color:var(--border2)}
.nav a .pill{background:var(--orange);color:#1a1205;border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px}

.main{max-width:1100px;margin:0 auto;padding:18px 14px 90px}
.crumbs{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
h1.page{font-size:26px;margin:2px 0 4px}
.page-sub{color:var(--muted);margin:0 0 18px;font-size:14px}

/* ====== CARDS / GRID ====== */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.g2.sm1,.g3,.g4{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--border);
  border-radius:var(--radius);padding:16px}
.card.hero{background:linear-gradient(160deg,rgba(7,150,76,.25),rgba(15,21,18,.6));border-color:var(--border2)}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.stat .val{font-size:24px;font-weight:800}
.stat .val.green{color:var(--green)} .stat .val.orange{color:var(--orange)} .stat .val.red{color:var(--red)}
.stat .sub{font-size:12px;color:var(--muted2)}

.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick button{text-align:left;background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px;color:var(--text);display:flex;align-items:center;gap:12px}
.quick button:active{transform:scale(.98)}
.quick .ic{width:38px;height:38px;flex:0 0 auto;border-radius:11px;background:rgba(53,216,117,.14);
  display:flex;align-items:center;justify-content:center;color:var(--green)}
.quick .tx b{display:block;font-size:14.5px}
.quick .tx span{font-size:12px;color:var(--muted)}

/* ====== BUTTONS ====== */
.btn{border:none;border-radius:12px;padding:12px 16px;font-size:14.5px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,var(--green2),var(--green-d));color:#04130a}
.btn.ghost{background:var(--card3);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:rgba(255,91,91,.14);color:var(--red);border:1px solid rgba(255,91,91,.35)}
.btn.wide{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}

/* ====== TOOLBAR (busca + add) ====== */
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:160px;display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--border);border-radius:12px;padding:0 12px}
.search input{flex:1;background:transparent;border:none;outline:none;color:var(--text);padding:12px 0;font-size:14px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--border);color:var(--muted);
  border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.chip.active{background:rgba(53,216,117,.12);border-color:var(--border2);color:var(--green)}

/* ====== LIST ITEMS ====== */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--border);
  border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.item .av{width:42px;height:42px;flex:0 0 auto;border-radius:11px;background:rgba(53,216,117,.12);
  color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.item .bd{flex:1;min-width:0}
.item .bd .t{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .bd .m{color:var(--muted);font-size:13px;margin-top:3px}
.item .rt{text-align:right;white-space:nowrap}
.item .rt .money{font-weight:800;color:var(--green)}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.3px;white-space:nowrap}
.badge.green{background:rgba(53,216,117,.16);color:var(--green)}
.badge.orange{background:rgba(255,159,28,.16);color:var(--orange)}
.badge.blue{background:rgba(88,178,255,.16);color:var(--blue)}
.badge.red{background:rgba(255,91,91,.16);color:var(--red)}
.badge.gray{background:var(--card3);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty .big{font-size:40px;margin-bottom:8px;opacity:.8}

/* ====== MODAL ====== */
.modal-bg{position:fixed;inset:0;background:rgba(2,4,3,.72);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:620px){.modal-bg{align-items:center;padding:20px}}
.modal{width:100%;max-width:560px;background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--border2);border-top-left-radius:22px;border-top-right-radius:22px;border-radius:22px;
  max-height:92dvh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-h b{font-size:17px;flex:1}
.modal-b{padding:16px 18px;overflow-y:auto}
.modal-f{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:10px}
.modal-f .btn{flex:1}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{width:100%;background:var(--bg2);border:1px solid var(--border);
  color:var(--text);border-radius:11px;padding:12px;font-size:15px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--border2)}
.field textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.row2{grid-template-columns:1fr}}

/* ====== TOAST ====== */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));
  background:var(--card3);border:1px solid var(--border2);color:var(--text);padding:12px 18px;border-radius:12px;
  z-index:200;font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast.ok{border-color:var(--border2)} .toast.err{border-color:rgba(255,91,91,.5);color:#ffd4d4}

/* carrinho */
.cart-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--card3);color:var(--text);font-size:18px;font-weight:700}

@media print{
  body{background:#fff;color:#000}
  .topbar,.nav,.main>*:not(#printArea){display:none !important}
  #printArea{display:block !important}
}
</style>
<script src="supabase.js"></script>
</head>
<body>
<div id="root"></div>
<div id="modalRoot"></div>

<script>
"use strict";
/* ============================================================
   SOBERANO — Assistência Técnica (app próprio, versão local)
   Dados ficam no PRÓPRIO aparelho (localStorage). Sem servidor.
   ============================================================ */

/* ---------- Supabase (nuvem) ---------- */
const SUPA_URL = "https://ckyjtdtpduyczucjmdmc.supabase.co";
const SUPA_KEY = "sb_publishable_wc-zt3vcBsGZIxkcxUtXlw_ld1nIqdm";
const supa = window.supabase.createClient(SUPA_URL, SUPA_KEY);
const CACHE = "soberano_cache_v1"; // cópia local, para abrir rápido e aguentar queda de internet
const DB_DEFAULT = { config:{loja:"Soberano Assistência Técnica",dono:""}, clientes:[], aparelhos:[], ordens:[], produtos:[], vendas:[], caixa:[], seq:{os:0,venda:0} };
let DB = cacheLoad();
let ultimoStamp = null;   // marca da última gravação feita por ESTE aparelho (ignora o eco do tempo real)
let canal = null;         // canal de sincronização em tempo real

function cacheLoad(){ try{ return Object.assign(structuredClone(DB_DEFAULT), JSON.parse(localStorage.getItem(CACHE)||"{}")); }catch(e){ return structuredClone(DB_DEFAULT); } }
function cacheSave(){ try{ localStorage.setItem(CACHE, JSON.stringify(DB)); }catch(e){} }
function load(){ return DB; } // compatibilidade

// Traz os dados da nuvem para a memória
async function carregarNuvem(){
  try{
    const { data, error } = await supa.from('app_estado').select('dados').eq('id','loja').single();
    if(error) throw error;
    DB = Object.assign(structuredClone(DB_DEFAULT), (data && data.dados) || {});
    if(!DB.config) DB.config = {loja:"Soberano Assistência Técnica",dono:""};
    cacheSave(); return true;
  }catch(e){ DB = cacheLoad(); return false; }
}

// Salva na nuvem (e guarda cópia local). Chamado após cada mudança.
async function save(){
  cacheSave();
  const stamp = new Date().toISOString(); ultimoStamp = stamp;
  try{
    const { error } = await supa.from('app_estado').upsert({ id:'loja', dados:DB, atualizado_em:stamp });
    if(error) throw error;
  }catch(e){ toast('Sem internet — salvo no aparelho, sincroniza depois.','err'); }
}

// Sincronização em tempo real: se outro aparelho alterar, atualiza aqui
function assinarTempoReal(){
  if(canal) return;
  canal = supa.channel('estado-loja')
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'app_estado', filter:'id=eq.loja' }, (payload)=>{
      const novo = payload.new || {};
      if(novo.atualizado_em && novo.atualizado_em === ultimoStamp) return; // foi este aparelho
      if(document.getElementById('modalRoot').innerHTML) return;           // não atrapalha quem está editando
      DB = Object.assign(structuredClone(DB_DEFAULT), novo.dados || {});
      if(!DB.config) DB.config = {loja:"Soberano Assistência Técnica",dono:""};
      cacheSave(); render();
    })
    .subscribe();
}

/* ---------- Utilidades ---------- */
const $ = (s,el=document)=>el.querySelector(s);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function today(){ return new Date().toLocaleDateString('sv'); }
function money(n){ return (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtDate(iso){ if(!iso) return "—"; const [y,m,d]=iso.slice(0,10).split('-'); return `${d}/${m}/${y}`; }
function digits(s){ return String(s||"").replace(/\D/g,''); }
function initials(nome){ const p=String(nome||"?").trim().split(/\s+/); return ((p[0]||"?")[0]+(p[1]?p[1][0]:"")).toUpperCase(); }
function byId(arr,id){ return arr.find(x=>x.id===id); }

function toast(msg,type="ok"){
  const t=document.createElement('div'); t.className="toast "+type; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .3s";},1800);
  setTimeout(()=>t.remove(),2200);
}

/* ---------- Período ---------- */
function inPeriod(iso, period){
  if(!iso) return false;
  const d=iso.slice(0,10); const now=new Date(); const t=new Date(d+"T12:00:00");
  const ymd=s=>s.toLocaleDateString('sv');
  if(period==="tudo") return true;
  if(period==="hoje") return d===today();
  if(period==="semana"){ const w=new Date(now); w.setDate(now.getDate()-6); return d>=ymd(w)&&d<=today(); }
  if(period==="mes") return d.slice(0,7)===today().slice(0,7);
  if(period==="mespassado"){ const p=new Date(now.getFullYear(),now.getMonth()-1,1); return d.slice(0,7)===ymd(p).slice(0,7); }
  if(period==="ano") return d.slice(0,4)===today().slice(0,4);
  return true;
}
const PERIODOS=[["hoje","Hoje"],["semana","Esta semana"],["mes","Este mês"],["mespassado","Mês passado"],["ano","Este ano"],["tudo","Tudo"]];

/* ---------- Status de OS ---------- */
const STATUS={
  em_analise:{label:"Em análise",cor:"orange"},
  aguardando_pecas:{label:"Aguardando peças",cor:"orange"},
  em_manutencao:{label:"Em manutenção",cor:"blue"},
  em_testes:{label:"Em testes",cor:"blue"},
  concluida:{label:"Concluída",cor:"green"},
  entregue:{label:"Entregue ao cliente",cor:"green"},
  cancelada:{label:"Cancelada",cor:"red"},
};
const STATUS_ABERTOS=["em_analise","aguardando_pecas","em_manutencao","em_testes","concluida"];
const osAberta = o => o.status!=="entregue" && o.status!=="cancelada";
const osFaturavel = o => o.status==="concluida" || o.status==="entregue";
const osTotal = o => (Number(o.servico)||0) + (o.pecas||[]).reduce((s,p)=>s+(Number(p.valor)||0),0);
const PAGAMENTOS=["Dinheiro","Pix","Cartão de débito","Cartão de crédito"];

/* ---------- Ícones (SVG inline) ---------- */
const IC={
  grid:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  wrench:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 00-5.4 5.2L4 17l3 3 5.5-5.3a4 4 0 005.2-5.4l-2.5 2.5-2.1-.6-.6-2.1 2.5-2.5z"/></svg>',
  user:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  phone:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="3"/><line x1="11" y1="18" x2="13" y2="18"/></svg>',
  box:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>',
  cart:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2 3h3l2.5 13h11L21 7H6"/></svg>',
  money:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
  cog:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>',
  out:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>',
};

/* ============================================================
   RENDER PRINCIPAL
   ============================================================ */
const ROUTES=[
  {id:"painel",label:"Visão geral",ic:IC.grid},
  {id:"ordens",label:"Ordens de serviço",ic:IC.wrench},
  {id:"clientes",label:"Clientes",ic:IC.user},
  {id:"aparelhos",label:"Aparelhos",ic:IC.phone},
  {id:"estoque",label:"Estoque",ic:IC.box},
  {id:"vendas",label:"Vendas",ic:IC.cart},
  {id:"financeiro",label:"Financeiro",ic:IC.money},
  {id:"conta",label:"Conta",ic:IC.cog},
];
let current="painel";
let deferredInstall=null;

function app(){ return mainShell(); }

function render(){ document.getElementById('root').innerHTML = app(); bind(); }

/* ---------- Topbar + Nav ---------- */
function mainShell(){
  const abertas = DB.ordens.filter(osAberta).length;
  const nav = ROUTES.map(r=>`<a href="#" data-route="${r.id}" class="${r.id===current?'active':''}">
      <span class="dot">${r.ic}</span>${esc(r.label)}
      ${r.id==='ordens'&&abertas?`<span class="pill">${abertas}</span>`:''}</a>`).join('');
  return `
  <div class="topbar"><div class="topbar-in">
    <div class="brand"><img src="icon-192.png" alt="Soberano"/><div class="bt"><b>SOBERANO</b><span>Assistência Técnica</span></div></div>
    <div class="spacer"></div>
    <button class="icon-btn ghost" id="btnInstall" style="display:none">⬇ Instalar</button>

   ============================================================ */
let painelPeriodo="mes";
function faturamento(period){
  const assist = DB.ordens.filter(o=>osFaturavel(o)&&inPeriod(o.finalizadaEm||o.abertaEm,period)).reduce((s,o)=>s+osTotal(o),0);
  const vendas = DB.vendas.filter(v=>inPeriod(v.data,period)).reduce((s,v)=>s+v.total,0);
  const lucroVendas = DB.vendas.filter(v=>inPeriod(v.data,period)).reduce((s,v)=>s+(v.lucro||0),0);
  const despesas = DB.caixa.filter(c=>c.tipo==="despesa"&&inPeriod(c.data,period)).reduce((s,c)=>s+c.valor,0);
  const entradasExtra = DB.caixa.filter(c=>c.tipo==="entrada"&&inPeriod(c.data,period)).reduce((s,c)=>s+c.valor,0);
  const lucro = assist + lucroVendas + entradasExtra - despesas;
  return {assist,vendas,despesas,entradasExtra,lucro,total:assist+vendas+entradasExtra};
}

let onSaveFn=null;
function modal(title, body, saveLabel="Salvar"){
  document.getElementById('modalRoot').innerHTML=`
   <div class="modal-bg" id="mbg"><div class="modal">
     <div class="modal-h"><b>${esc(title)}</b><button class="icon-btn ghost" id="mClose">✕</button></div>

     <div class="modal-f"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn primary" id="mSave">${esc(saveLabel)}</button></div>
   </div></div>`;
  $("#mClose").onclick=$("#mCancel").onclick=closeModal;
  $("#mbg").onclick=e=>{ if(e.target.id==="mbg") closeModal(); };
  $("#mSave").onclick=()=>{ if(onSaveFn) onSaveFn(); };
}

function avisarWhatsapp(c,o){
  if(!c||!c.telefone) return toast("Cliente sem telefone cadastrado.","err");
  const st=STATUS[o.status]?STATUS[o.status].label:o.status;
  const msg=`Olá, ${c.nome}! Aqui é da ${DB.config.loja||'Soberano Assistência Técnica'}.\n`+
    `Sua OS #${String(o.numero).padStart(4,'0')} (${o.aparelho}) está: *${st}*.\n`+
    (osFaturavel(o)?`Valor: ${money(osTotal(o))}.\n`:'')+`Qualquer dúvida, estamos à disposição!`;
  window.open(`https://wa.me/55${digits(c.telefone)}?text=${encodeURIComponent(msg)}`,'_blank');
}

/* --- Venda / carrinho --- */
let carrinho=[];
function formVenda(){
  carrinho=[];
  renderVendaModal();
}
function renderVendaModal(){
  const total=carrinho.reduce((s,i)=>s+i.preco*i.qtd,0);
  const disp=DB.produtos.filter(p=>p.qtd>0);
  const prodOpts=disp.map(p=>`<option value="${p.id}">${esc(p.nome)} — ${money(p.venda)} (${p.qtd} disp.)</option>`).join('');
  const itensHTML=carrinho.length?carrinho.map((i,idx)=>`
    <div class="cart-item"><div style="flex:1;min-width:0"><b>${esc(i.nome)}</b><div class="m">${money(i.preco)} cada</div></div>
      <div class="qty"><button data-cq="-" data-i="${idx}">−</button><b>${i.qtd}</b><button data-cq="+" data-i="${idx}">+</button></div>
      <div class="money" style="color:var(--green);min-width:70px;text-align:right">${money(i.preco*i.qtd)}</div></div>`).join(''):'<div class="m" style="color:var(--muted);padding:8px 0">Carrinho vazio. Adicione produtos abaixo.</div>';
  modal("Nova venda",`
    <div class="field"><label>Adicionar produto</label>
      <div style="display:flex;gap:8px"><select id="v_prod"><option value="">— escolher —</option>${prodOpts}</select><button class="btn primary sm" id="v_add">${IC.plus}</button></div>
    </div>
    <div id="v_itens">${itensHTML}</div>
    <div style="display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)"><b>Total</b><b class="money" style="color:var(--green);font-size:20px">${money(total)}</b></div>
    <div class="field" style="margin-top:14px"><label>Forma de pagamento</label><select id="v_forma">${PAGAMENTOS.map(p=>`<option>${p}</option>`).join('')}</select></div>
  `,"Finalizar venda");
  $("#v_add").onclick=()=>{
    const pid=$("#v_prod").value; if(!pid) return;
    const p=byId(DB.produtos,pid); const exist=carrinho.find(i=>i.produtoId===pid);
    const emCarrinho=exist?exist.qtd:0;
    if(emCarrinho+1>p.qtd) return toast("Sem estoque suficiente.","err");
    if(exist) exist.qtd++; else carrinho.push({produtoId:pid,nome:p.nome,preco:p.venda,custo:p.custo,qtd:1});
    renderVendaModal();
  };
  document.querySelectorAll('[data-cq]').forEach(b=>b.onclick=()=>{
    const i=carrinho[+b.dataset.i]; const p=byId(DB.produtos,i.produtoId);
    if(b.dataset.cq==="+"){ if(i.qtd+1>p.qtd) return toast("Sem estoque.","err"); i.qtd++; }
    else { i.qtd--; if(i.qtd<=0) carrinho=carrinho.filter(x=>x!==i); }
    renderVendaModal();
  });
  onSaveFn=()=>{
    if(!carrinho.length) return toast("Carrinho vazio.","err");
    const total=carrinho.reduce((s,i)=>s+i.preco*i.qtd,0);
    const lucro=carrinho.reduce((s,i)=>s+(i.preco-(i.custo||0))*i.qtd,0);
    carrinho.forEach(i=>{ const p=byId(DB.produtos,i.produtoId); if(p) p.qtd=Math.max(0,p.qtd-i.qtd); });
    DB.seq.venda=(DB.seq.venda||0)+1;
    DB.vendas.push({id:uid(),numero:DB.seq.venda,itens:carrinho.map(i=>({produtoId:i.produtoId,nome:i.nome,preco:i.preco,qtd:i.qtd})),
      total,lucro,forma:$("#v_forma").value,data:today(),criadoEm:new Date().toISOString()});
    save(); closeModal(); toast("Venda registrada ✓"); go("vendas");
  };
}

function alterarSenha(){
  modal("Alterar senha",`
    <div class="field"><label>Senha atual</label><input id="s_atual" type="password"></div>
    <div class="field"><label>Nova senha (mín. 6)</label><input id="s_nova" type="password"></div>

  onSaveFn=async ()=>{
    const atual=val("s_atual"), nova=val("s_nova");
    if(nova.length<6) return toast("Use ao menos 6 caracteres.","err");
    if(nova!==val("s_rep")) return toast("As senhas não conferem.","err");
    const email=(await supa.auth.getUser()).data.user?.email;

    const r2=await supa.auth.updateUser({ password:nova });
    if(r2.error) return toast("Não deu pra alterar a senha.","err");
    closeModal(); toast("Senha alterada ✓");
  };
}

function importarBackup(){
  const inp=document.createElement('input'); inp.type="file"; inp.accept="application/json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.config) throw 0;
      if(confirm("Isto vai substituir os dados atuais pelo backup. Continuar?")){ DB=Object.assign(structuredClone(DB_DEFAULT),d); save(); toast("Backup importado ✓"); go("painel"); } }
      catch(e){ toast("Arquivo inválido.","err"); } };
    r.readAsText(f); };
  inp.click();
}

function bind(){
  // navegação (topbar + nav)
  document.querySelectorAll('[data-route]').forEach(a=>a.onclick=e=>{ e.preventDefault(); const r=a.dataset.route;
    if(a.dataset.new) { go(r); setTimeout(()=>formCliente(),50); } else go(r); });
  const bi=$("#btnInstall"); if(bi) bi.onclick=instalar;
  bindView();
}
function bindView(){
  const root=$("#view"); if(!root) return;
  // ações globais
  root.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>{
    const a=el.dataset.act;
    if(a==="nova-ordem") formOrdem();
    else if(a==="novo-cliente") formCliente();
    else if(a==="novo-aparelho") formAparelho();
    else if(a==="novo-produto") formProduto();
    else if(a==="nova-venda") formVenda();
    else if(a==="mov") formMov(el.dataset.tipo);
    else if(a==="editar-loja") editarLoja();
    else if(a==="alterar-senha") alterarSenha();
    else if(a==="sincronizar") carregarNuvem().then(ok=>{ toast(ok?'Atualizado ✓':'Sem internet agora.',ok?'ok':'err'); if(ok) go(current); });
    else if(a==="backup") exportarBackup();
    else if(a==="exemplo") carregarExemplo();
    else if(a==="zerar") zerarDados();
    else if(a==="sair") sairApp();
  });
  // navegação por data-route dentro das telas
  root.querySelectorAll('[data-route]').forEach(a=>a.onclick=e=>{ e.preventDefault(); const r=a.dataset.route;
    if(a.dataset.new){ go(r); setTimeout(()=>formCliente(),50); } else go(r); });
  // abrir detalhes
  root.querySelectorAll('[data-open-os]').forEach(el=>el.onclick=()=>detalheOrdem(el.dataset.openOs));
  root.querySelectorAll('[data-open-cliente]').forEach(el=>el.onclick=()=>{ const c=byId(DB.clientes,el.dataset.openCliente); formCliente(c); });
  root.querySelectorAll('[data-open-aparelho]').forEach(el=>el.onclick=()=>{ const a=byId(DB.aparelhos,el.dataset.openAparelho); formAparelho(a); });
  root.querySelectorAll('[data-open-produto]').forEach(el=>el.onclick=()=>{ const p=byId(DB.produtos,el.dataset.openProduto); formProduto(p); });
  root.querySelectorAll('[data-open-mov]').forEach(el=>el.onclick=()=>{ const m=byId(DB.caixa,el.dataset.openMov); formMov(m.tipo,m); });
  root.querySelectorAll('[data-zap]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); const c=byId(DB.clientes,el.dataset.zap);
     if(c&&c.telefone) window.open(`https://wa.me/55${digits(c.telefone)}`,'_blank'); else toast("Sem telefone.","err"); });
  // filtros / busca
  const h=(id,fn)=>{ const e=document.getElementById(id); if(e){ e.oninput=()=>{ fn(e.value); }; } };
  h("buscaOrdem",v=>{ordensBusca=v;refreshList(vOrdens);});
  h("buscaCliente",v=>{clientesBusca=v;refreshList(vClientes);});
  h("buscaAparelho",v=>{aparelhosBusca=v;refreshList(vAparelhos);});
  h("buscaEstoque",v=>{estoqueBusca=v;refreshList(vEstoque);});
  h("buscaVenda",v=>{vendasBusca=v;refreshList(vVendas);});
  root.querySelectorAll('[data-of]').forEach(b=>b.onclick=()=>{ordensFiltro=b.dataset.of;go("ordens");});
  root.querySelectorAll('[data-ef]').forEach(b=>b.onclick=()=>{estoqueFiltro=b.dataset.ef;go("estoque");});
  root.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{painelPeriodo=b.dataset.per;go("painel");});
  root.querySelectorAll('[data-fp]').forEach(b=>b.onclick=()=>{finPeriodo=b.dataset.fp;go("financeiro");});
}
// atualiza só a lista sem perder foco do campo de busca
function refreshList(viewFn){
  const root=$("#view"); const focId=document.activeElement&&document.activeElement.id; const pos=document.activeElement&&document.activeElement.selectionStart;
  root.innerHTML=viewFn(); bindView();
  if(focId){ const e=document.getElementById(focId); if(e){ e.focus(); try{e.setSelectionRange(pos,pos);}catch(_){} } }
}

/* ============================================================
   SETUP (primeiro acesso) + LOGIN
   ============================================================ */
function telaLogin(){
  document.getElementById('root').innerHTML=`<div class="auth-wrap"><div class="auth-card">
    <div class="auth-logo"><img src="icon-192.png" alt="Soberano"><b>SOBERANO</b><span>Assistência Técnica</span></div>
    <p style="text-align:center;color:var(--muted);font-size:14px;margin:0 0 18px">Acessar o sistema</p>
    <div class="field"><label>E-mail</label><input id="lg_email" type="email" value="soberanoassistenciatecnica@gmail.com" autocomplete="username"></div>
    <div class="field"><label>Senha</label><input id="lg_senha" type="password" placeholder="sua senha" autocomplete="current-password"></div>
    <button class="btn primary wide" id="lg_ok">Entrar</button>
    <button class="btn ghost wide" id="lg_novo" style="margin-top:10px">Primeiro acesso — criar senha</button>
  </div></div>`;
  const entrar=async ()=>{
    const email=val("lg_email"), senha=val("lg_senha");
    if(!email||!senha) return toast("Preencha e-mail e senha.","err");
    const btn=$("#lg_ok"); btn.disabled=true; btn.textContent="Entrando...";
    const { error }=await supa.auth.signInWithPassword({ email, password:senha });
    btn.disabled=false; btn.textContent="Entrar";
    if(error) return toast("E-mail ou senha incorretos.","err");
    await entrarApp();
  };
  const criar=async ()=>{
    const email=val("lg_email"), senha=val("lg_senha");
    if(!email) return toast("Informe o e-mail.","err");
    if(senha.length<6) return toast("Crie uma senha de pelo menos 6 caracteres.","err");
    const { data, error }=await supa.auth.signUp({ email, password:senha });
    if(error) return toast(error.message||"Não deu pra criar o acesso.","err");
    if(data.session){ toast("Acesso criado ✓"); await entrarApp(); }
    else toast("Conta criada — confirme pelo e-mail para entrar.","err");
  };
  $("#lg_ok").onclick=entrar;
  $("#lg_novo").onclick=criar;
  $("#lg_senha").addEventListener('keydown',e=>{ if(e.key==="Enter") entrar(); });
}

async function entrarApp(){
  await carregarNuvem();
  render();
  assinarTempoReal();
}

async function boot(){
  try{
    const { data:{ session } }=await supa.auth.getSession();
    if(session){ await entrarApp(); } else { telaLogin(); }
  }catch(e){ telaLogin(); }
  // ao voltar a internet, reenvia o que estiver em memória
  window.addEventListener('online', ()=>{ supa.auth.getSession().then(({data})=>{ if(data.session) save(); }); });
}

window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; const b=$("#btnInstall"); if(b) b.style.display="inline-flex"; });
window.addEventListener('appinstalled',()=>{ deferredInstall=null; const b=$("#btnInstall"); if(b) b.style.display="none"; toast("Aplicativo instalado ✓"); });
function instalar(){
  if(deferredInstall){ deferredInstall.prompt(); deferredInstall=null; return; }
  const iOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
  modal("Instalar o Soberano", iOS
    ? `<p>No iPhone/iPad, instale assim:</p><ol style="line-height:1.9;color:var(--muted)"><li>Toque no botão <b>Compartilhar</b> (quadrado com seta pra cima).</li><li>Deslize e toque em <b>"Adicionar à Tela de Início"</b>.</li><li>Toque em <b>Adicionar</b>.</li></ol>`
    : `<p>Para instalar:</p><ol style="line-height:1.9;color:var(--muted)"><li>Abra o menu do navegador (⋮).</li><li>Toque em <b>"Instalar app"</b> ou <b>"Adicionar à tela inicial"</b>.</li></ol>`,
    "Entendi");
  onSaveFn=closeModal;
}

/* ============================================================
   AUTO-ATUALIZAÇÃO (verifica se saiu versão nova e atualiza)
   ============================================================ */
const APP_VERSION = "2026-11-23b";
let avisoVersaoMostrado = false;
async function checarVersao(){
  try{
    const r = await fetch('versao.json?t=' + Date.now(), { cache: 'no-store' });
    if(!r.ok) return;
    const j = await r.json();
    if(j && j.versao && j.versao !== APP_VERSION){
      const el = document.activeElement;
      const editando = !!document.getElementById('modalRoot').innerHTML
        || (el && ['INPUT','TEXTAREA','SELECT'].includes(el.tagName));
      if(editando) bannerAtualizar();   // não interrompe quem está digitando
      else location.reload();            // atualiza sozinho
    }
  }catch(e){ /* sem internet: tenta de novo depois */ }
}
function bannerAtualizar(){
  if(avisoVersaoMostrado) return; avisoVersaoMostrado = true;
  const b = document.createElement('div');
  b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:300;background:linear-gradient(180deg,var(--green2),var(--green-d));color:#04130a;padding:10px 14px;border-radius:12px;font-weight:700;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;font-size:14px';
  b.innerHTML = '🔄 Nova versão disponível';
  const bt = document.createElement('button');
  bt.textContent = 'Atualizar';
  bt.style.cssText = 'background:#04130a;color:var(--green2);border:none;border-radius:8px;padding:6px 12px;font-weight:700';
  bt.onclick = ()=>location.reload();
  b.appendChild(bt);
  document.body.appendChild(b);
}
// verifica ao abrir, a cada 3 minutos, e ao voltar pro app
setTimeout(checarVersao, 8000);
setInterval(checarVersao, 180000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') checarVersao(); });

/* ============================================================
   PUXAR PARA BAIXO = ATUALIZAR (pull-to-refresh)
   ============================================================ */
(function(){
  let startY = 0, pulling = false, ind = null;
  const LIMITE = 70;
  const noTopo = ()=> (window.scrollY || document.documentElement.scrollTop || 0) <= 2;
  const temApp = ()=> !!document.getElementById('view');
  const editando = ()=> !!document.getElementById('modalRoot').innerHTML;
  function indicador(){
    if(!ind){
      ind = document.createElement('div');
      ind.style.cssText = 'position:fixed;top:0;left:50%;z-index:250;background:var(--card3);border:1px solid var(--border2);color:var(--green);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:var(--shadow);transition:opacity .2s;transform:translateX(-50%)';
      document.body.appendChild(ind);
    }
    return ind;
  }
  function esconder(){ if(ind){ ind.style.top = '-50px'; ind.style.opacity = '0'; } }
  document.addEventListener('touchstart', (e)=>{
    pulling = (e.touches.length === 1 && noTopo() && temApp() && !editando());
    if(pulling) startY = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchmove', (e)=>{
    if(!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if(dy > 0 && noTopo()){
      const i = indicador();
      const puxado = Math.min(dy, 110);
      i.style.opacity = '1';
      i.style.top = Math.min(puxado - 46, 16) + 'px';
      i.textContent = puxado >= LIMITE ? '↑' : '↓';
    }
  }, {passive:true});
  document.addEventListener('touchend', (e)=>{
    if(!pulling) return; pulling = false;
    const dy = e.changedTouches[0].clientY - startY;
    if(dy >= LIMITE && ind){
      ind.textContent = '⟳'; ind.style.top = '16px'; ind.style.opacity = '1';
      atualizar();
    } else { esconder(); }
  }, {passive:true});
  async function atualizar(){
    try{ await carregarNuvem(); render(); toast('Atualizado ✓'); }
    catch(e){ toast('Sem internet agora.','err'); }
    checarVersao();
    setTimeout(esconder, 400);
  }
})();
